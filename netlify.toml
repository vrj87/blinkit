# Netlify — Smart Category Explorer (monorepo)
# Docs: https://docs.netlify.com/build/configure-builds/monorepos/

[build]
  # Install workspaces from repo root, then build the MVP app
  command = "npm install && cd apps/mvp && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build"
  publish = "apps/mvp/.next"

[build.environment]
  NODE_VERSION = "20"
  DATABASE_URL = "file:./dev.db"

[[plugins]]
  package = "@netlify/plugin-nextjs"
